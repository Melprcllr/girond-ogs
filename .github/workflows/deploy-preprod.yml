name: Deploy preproduction

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: girondogs-preproduction-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish preproduction artifacts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Backend
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Build backend
        working-directory: backend
        run: npm run build

      # Frontend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Build frontend staging
        working-directory: frontend
        run: npm run build:staging

      # Prepare deployment branch
      - name: Prepare deployment files
        run: |
          mkdir -p deploy/backend deploy/frontend

          cp -a backend/dist deploy/backend/
          cp -a frontend/dist deploy/frontend/

          cat > deploy/.cpanel.yml <<'EOF'
          ---
          deployment:
            tasks:
              - /usr/bin/rsync -a --delete /home2/royu4379/repositories/girondogs-preprod/backend/dist/ /home2/royu4379/girondogs-api-test/dist/
              - /usr/bin/rsync -a --delete --exclude='.well-known/' --exclude='cgi-bin/' /home2/royu4379/repositories/girondogs-preprod/frontend/dist/ /home2/royu4379/test.girondogs.fr/
              - /usr/bin/touch /home2/royu4379/girondogs-api-test/tmp/restart.txt
          EOF

      # Publish artifacts
      - name: Publish preproduction branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: preprod-build
          publish_dir: ./deploy
          commit_message: "deploy: publish preproduction artifacts"
