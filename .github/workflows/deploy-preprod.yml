name: Deploy preproduction

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: girondogs-preproduction-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build frontend and backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build:staging
        env:
          VITE_API_URL: https://api-test.girondogs.fr

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  deploy:
    name: SSH deployment dry run
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download backend build
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend-dist/

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/girondogs_preprod_deploy"
          chmod 600 "$HOME/.ssh/girondogs_preprod_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify SSH and preproduction directories
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i "$HOME/.ssh/girondogs_preprod_deploy" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            'test -d /home2/royu4379/test.girondogs.fr &&
             test -d /home2/royu4379/girondogs-api-test/dist &&
             test -d /home2/royu4379/girondogs-api-test/tmp &&
             command -v rsync'

      - name: Simulate backend transfer
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -azn --delete --itemize-changes \
            -e "ssh -i $HOME/.ssh/girondogs_preprod_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            backend-dist/ \
            "$SSH_USER@$SSH_HOST:/home2/royu4379/girondogs-api-test/dist/"

      - name: Simulate frontend transfer
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -azn --delete --itemize-changes \
            --exclude='/.well-known/' \
            --exclude='/cgi-bin/' \
            -e "ssh -i $HOME/.ssh/girondogs_preprod_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            frontend-dist/ \
            "$SSH_USER@$SSH_HOST:/home2/royu4379/test.girondogs.fr/"
